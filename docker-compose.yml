services:
  tests:
    build: .
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./boilerplate_python:/usr/src/app/boilerplate_python
      - ./tests:/usr/src/app/tests
      - ./README.md:/usr/src/app/README.md
      - ./pyproject.toml:/usr/src/app/pyproject.toml
    command: pytest-watch -n -p
