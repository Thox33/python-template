[project]
name = "boilerplate-python"
version = "0.1.0-rc.1+develop.20261104"
description = ""
authors = [{ name = "Thorge Becker", email = "ThorgeBecker@t-online.de" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.14.2,<3",
]

[project.optional-dependencies]
# uvloop publishes no Windows wheels and refuses to build there, so the extra
# has to stay out of the resolution on win32.
performance = ["uvloop>=0.23.0,<0.24; sys_platform != 'win32'"]

[project.scripts]
template-python = "boilerplate_python.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pyfakefs==6.2.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest-icdiff==0.9",
    "pytest-mock==3.17.0",
    "pytest-sugar==1.1.1",
    "pytest-watcher==0.6.3",
    "python-semantic-release==10.7.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.14"]
build-backend = "uv_build"

# Ruff Configuration
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (fine in tests)
    "T201",  # print statements (sometimes needed)
    "PT009", # pytest unittest assertion style
]

[tool.ruff.lint.isort]
known-first-party = ["boilerplate_python"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts in tests are fine
    "S106",  # hardcoded passwords in tests are fine
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pytest Configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--doctest-modules",
    "--cov=boilerplate_python",
    "--cov-fail-under=0", # TODO Increase minimum code coverage
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Pydantic MyPy Plugin
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Coverage Configuration
[tool.coverage.run]
source = ["src/boilerplate_python"]
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Semantic Release Configuration
[tool.semantic_release]
allow_zero_version = true
build_command = "uv build"
commit_author = "github-actions <github-actions@github.com>"
commit_message = "chore(release): releasing version {version}  [skip ci]"
major_on_zero = true
version_variables = [
    "src/boilerplate_python/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:project.version"
]

[tool.semantic_release.branches.stable]
match = "main"
prerelease = false

[tool.semantic_release.branches.beta]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.alpha]
match = "feature-.*"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^Merge pull request",
    "^Merge remote",
    "^Merge branch",
    "^chore(release):.*",
    "^build(deps-dev):.*"
]
