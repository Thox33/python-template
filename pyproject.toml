[tool.poetry]
name = "boilerplate-python"
version = "0.1.0-rc.1+develop.20261008"
description = ""
authors = ["Thorge Becker <ThorgeBecker@t-online.de>"]
readme = "README.md"
packages = [{ include = "boilerplate_python" }]

[tool.poetry.scripts]
template-python = "boilerplate_python.main:main"

[tool.poetry.extras]
performance = ["uvloop"]

[tool.poetry.dependencies]
python = ">=3.11, <3.14"
pydantic = "^1.10.23"
uvloop = { version = "^0.23.0", optional = true }

[tool.poetry.group.dev.dependencies]
pre-commit = "4.6.2"
mypy = "1.19.1"
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
pytest-cov = "7.1.0"
python-semantic-release = "8.0.8"
sphinx = "8.2.3"
sphinx-rtd-theme = "3.1.0"
sphinx-autodoc-typehints = "3.5.2"
livereload = "2.7.1"
pytest-watch = "4.2.0"
pytest-sugar = "1.1.1"
pytest-icdiff = "0.9"
bandit = "1.9.4"
pytest-mock = "3.16.0"
pyfakefs = "6.2.0"
enum-tools = { extras = ["sphinx"], version = "0.13.0" }
ruff = "0.16.10"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

# Ruff Configuration
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "docs",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # use of assert (fine in tests)
    "T201",  # print statements (sometimes needed)
    "PT009", # pytest unittest assertion style
]

[tool.ruff.lint.isort]
known-first-party = ["boilerplate_python"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts in tests are fine
    "S106",  # hardcoded passwords in tests are fine
    "ARG",   # unused function arguments in tests are fine
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pytest Configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--doctest-modules",
    "--cov=boilerplate_python",
    "--cov-fail-under=0", # TODO Increase minimum code coverage
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# MyPy Configuration
[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["docs"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Pydantic MyPy Plugin (für v1)
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# Bandit Configuration
[tool.bandit]
exclude_dirs = ["docs", "tests"]
skips = ["B101"]  # Skip assert_used test

# Coverage Configuration
[tool.coverage.run]
source = ["boilerplate_python"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Semantic Release Configuration
[tool.semantic_release]
build_command = "source $VENV && poetry build && cd .."
commit_author = "github-actions <github-actions@github.com>"
commit_message = "chore(release): releasing version {version}  [skip ci]"
major_on_zero = true
version_variables = [
    "boilerplate_python/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:tool.poetry.version"
]

[tool.semantic_release.branches.stable]
match = "main"
prerelease = false

[tool.semantic_release.branches.beta]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.alpha]
match = "feature-.*"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^Merge pull request",
    "^Merge remote",
    "^Merge branch",
    "^chore(release):.*",
    "^build(deps-dev):.*"
]
