[tool.poetry]
name = "boilerplate-python"
version = "0.0.0"
description = ""
authors = ["Thorge Becker <ThorgeBecker@t-online.de>"]
readme = "README.md"
packages = [{ include = "boilerplate_python" }]

[tool.poetry.scripts]
template-python = "boilerplate_python.main:main"

[tool.poetry.extras]
performance = ["uvloop"]

[tool.poetry.dependencies]
python = ">=3.11, <3.12"
pydantic = "1.10.22"
uvloop = { version = "0.20.0", optional = true }

[tool.poetry.group.dev.dependencies]
pre-commit = "4.2.0"
mypy = "1.15.0"
pytest = "8.3.5"
pytest-asyncio = "0.26.0"
pytest-cov = "6.1.1"
python-semantic-release = "8.0.8"
sphinx = "8.2.3"
sphinx-rtd-theme = "3.0.2"
sphinx-autodoc-typehints = "3.2.0"
livereload = "2.7.1"
pytest-watch = "4.2.0"
pytest-sugar = "1.0.0"
pytest-icdiff = "0.9"
bandit = { extras = ["toml"], version = "1.8.3" }
pytest-mock = "3.14.0"
pyfakefs = "5.8.0"
enum-tools = { extras = ["sphinx"], version = "0.13.0" }
ruff = "^0.11.7"

[build-system]
requires = ["poetry-core>=1.6.1"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = ["docs", "tests"]
skips = []

[tool.semantic_release]
build_command = "source $VENV && poetry build && cd .."
commit_author = "github-actions <github-actions@github.com>"
commit_message = "chore(release): releasing version {version}  [skip ci]"
major_on_zero = true
version_variables = [
    "boilerplate_python/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:tool.poetry.version"
]

[tool.semantic_release.branches.stable]
match = "main"
prerelease = false

[tool.semantic_release.branches.beta]
match = "develop"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.branches.alpha]
match = "feature-.*"
prerelease = true
prerelease_token = "alpha"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^Merge pull request",
    "^Merge remote",
    "^Merge branch",
    "^chore(release):.*",
    "^build(deps-dev):.*"
]
