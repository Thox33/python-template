name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          enablement: true
          static_site_generator: "sphinx"

      - name: Configure GitHub Pages via API
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Configuring GitHub Pages to use GitHub Actions..."
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"main","path":"/"},"build_type":"workflow"}')
          echo "API Response: $RESPONSE"

      - name: Detailed GitHub Pages Debug
        run: |
          echo "=== GitHub Context ==="
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Ref: ${{ github.ref }}"

          echo "=== GitHub Pages API Status ==="
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "Pages API Status Code: $STATUS_CODE"

          if [ "$STATUS_CODE" != "404" ]; then
            echo "Pages info:"
            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/pages
          else
            echo "GitHub Pages not configured yet"
          fi

          echo "=== GitHub Token Permissions ==="
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/rate_limit | grep -o '"scopes": "[^"]*"' || echo "Could not retrieve token scopes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Inject build timestamp
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "Build timestamp: $BUILD_DATE"
          echo "<div style='text-align:center;margin-top:50px;color:gray;font-size:smaller;'>Last updated: $BUILD_DATE</div>" > docs/_build_timestamp.html
        shell: bash

      - name: Build Docs
        run: |
          source .venv/bin/activate
          cd docs
          make clean html
          # Inject build timestamp into all HTML files
          find build/html -name "*.html" -exec sed -i '/<\/body>/i <!-- Build Timestamp -->\n$(cat _build_timestamp.html)' {} \;
        env:
          VIRTUAL_ENV: .venv

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Report Deployment Result
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ steps.deployment.outcome }}" == "success" ]; then
            echo "Deployment successful!"
          else
            echo "Deployment failed."
            echo "Manual configuration may be required. Please go to your repository settings,"
            echo "navigate to 'Pages' section, and set the source to 'GitHub Actions'."
          fi
