name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Inject build timestamp
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "Build timestamp: $BUILD_DATE"
          echo "<div style='text-align:center;margin-top:50px;color:gray;font-size:smaller;'>Last updated: $BUILD_DATE</div>" > docs/_build_timestamp.html
        shell: bash

      - name: Build Docs
        run: |
          source .venv/bin/activate
          cd docs
          make clean html
          # Inject build timestamp into all HTML files
          find build/html -name "*.html" -exec sed -i '/<\/body>/i <!-- Build Timestamp -->\n$(cat _build_timestamp.html)' {} \;
        env:
          VIRTUAL_ENV: .venv

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
