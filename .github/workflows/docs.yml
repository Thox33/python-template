name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug GitHub context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-python-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          poetry install --no-interaction

      - name: Inject build timestamp
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "Build timestamp: $BUILD_DATE"
          echo "<div style='text-align:center;margin-top:50px;color:gray;font-size:smaller;'>Last updated: $BUILD_DATE</div>" > docs/_build_timestamp.html
        shell: bash

      - name: Build Docs
        run: |
          source .venv/bin/activate
          cd docs
          make clean html
          # Inject build timestamp into all HTML files
          find build/html -name "*.html" -exec sed -i '/<\/body>/i <!-- Build Timestamp -->\n$(cat _build_timestamp.html)' {} \;
        env:
          VIRTUAL_ENV: .venv

      # Option 1: Direktes Veröffentlichen auf gh-pages Branch
      - name: Deploy to GitHub Pages via gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          publish_branch: gh-pages
          user_name: github-actions
          user_email: github-actions@github.com

      # Option 2: GitHub Pages Workflow (falls Option 1 fehlschlägt)
      - name: Debug Pages API Access (nur für Logging)
        if: github.ref == 'refs/heads/main'
        run: |
          # Wir verwenden dryrun, um nur die API-Anfrage zu testen ohne tatsächliche Änderungen
          echo "Testing GitHub Pages API access..."
          curl -s -o /dev/null -w "Status Code: %{http_code}\n" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}
          echo "GitHub Token Permissions (sollte admin:repo_hook und repo beinhalten):"
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3+json" \
               https://api.github.com/rate_limit | grep -o '"scopes": "[^"]*"'

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v4
        with:
          enablement: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/build/html'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
