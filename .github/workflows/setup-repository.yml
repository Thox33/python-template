name: Setup Repository

on:
  workflow_dispatch:

jobs:
  create-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          token: ${{ secrets.GH_TOKEN }}

      - name: Replace boilerplate project names
        run: |
          PROJECT_NAME_RAW="${{ github.event.repository.name }}"
          echo "Original project name: ${PROJECT_NAME_RAW}"
          PROJECT_NAME_NORMALIZED="$(echo "${PROJECT_NAME_RAW}" | sed -E 's/[_-]+/ /g' | sed -E 's/([a-z])([A-Z])/\1 \2/g' | tr '[:upper:]' '[:lower:]')"
          echo "Normalized project name: ${PROJECT_NAME_NORMALIZED}"

          PROJECT_NAME_KEBAB_CASE="$(echo "${PROJECT_NAME_NORMALIZED}" | tr ' ' '-' )"
          PROJECT_NAME_SNAKE_CASE="$(echo "${PROJECT_NAME_NORMALIZED}" | tr ' ' '_' )"
          PROJECT_NAME_TITLE_CASE="$(echo "${PROJECT_NAME_NORMALIZED}" | sed -E 's/(^| )([a-z])/\1\u\2/g')"

          echo "Replacing placeholders in relevant files"

          find . -type f -not -path "./.git/*" -exec sed -i "s/boilerplate-python/${PROJECT_NAME_KEBAB_CASE}/g" {} +
          find . -type f -not -path "./.git/*" -exec sed -i "s/boilerplate_python/${PROJECT_NAME_SNAKE_CASE}/g" {} +
          find . -type f -not -path "./.git/*" -exec sed -i "s/Boilerplate Python/${PROJECT_NAME_TITLE_CASE}/g" {} +

          if [ -d "boilerplate_python" ] && [ "$PROJECT_NAME_SNAKE_CASE" != "boilerplate_python" ]; then
            echo "Renaming directory 'boilerplate_python' to '$PROJECT_NAME_SNAKE_CASE'"
            mv "boilerplate_python" "$PROJECT_NAME_SNAKE_CASE"
          else
            echo "Skipping rename, either 'boilerplate_python' does not exist or the target name is the same."
          fi

          if git diff --quiet; then
            echo "No changes found, skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: replace boilerplate project names"

            # Add workflow scope to token for pushing workflow files
            git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:develop || {
              echo "⚠️ Warning: Failed to push changes. This might be due to token permissions."
              echo "Make sure your token has 'workflow' scope if you're modifying workflow files."
            }
          fi

      - name: Check if main branch exists
        id: check_main
        run: |
          git fetch --all
          if git rev-parse --verify origin/main > /dev/null 2>&1; then
            echo "main branch already exists, skipping creation."
            echo "exists=true" >> $GITHUB_ENV
          else
            echo "main branch does not exist, proceeding with creation."
            echo "exists=false" >> $GITHUB_ENV
          fi

      - name: Create main branch
        if: env.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git push https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git main || {
            echo "⚠️ Warning: Failed to push main branch."
          }

  create-labels:
    runs-on: ubuntu-latest
    needs: create-main
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GH_TOKEN }}"
      - name: Add missing labels
        run: |
          labels=("automation" "sync")
          for label in "${labels[@]}"; do
            # Check if label already exists
            existing_label=$(gh api /repos/${{ github.repository }}/labels | jq -r ".[] | select(.name == \"$label\") | .name")
            if [ -z "$existing_label" ]; then
              echo "Creating label: $label"
              echo "{\"name\": \"$label\", \"color\": \"f7c6c7\", \"description\": \"Automated label\"}" | gh api --method POST /repos/${{ github.repository }}/labels --input - || {
                echo "⚠️ Warning: Failed to create label $label."
              }
            else
              echo "Label $label already exists. Skipping creation."
            fi
          done

  set-protections:
    runs-on: ubuntu-latest
    needs: create-main
    permissions:
      contents: write
      id-token: write
    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2) Install GH CLI & jq
      - name: Install GitHub CLI & jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      # 3) Verify installation
      - name: Verify GH CLI version
        run: gh --version

      # 4) Authenticate
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token

      # 5) Protect main with error handling
      - name: Configure main branch protection
        run: |
          echo "Attempting to configure main branch protection..."
          gh api --method PUT /repos/${{ github.repository }}/branches/main/protection \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["prerelease","test","code-style"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "required_conversation_resolution": true
          }
          EOF
          if [ $? -ne 0 ]; then
            echo "⚠️ Warning: Failed to set main branch protection."
            echo "This feature requires either GitHub Pro or a public repository."
            # Don't exit with error
          else
            echo "✓ Main branch protection configured successfully."
          fi

      # 6) Protect develop with fallback and error handling
      - name: Configure develop branch protection
        run: |
          echo "Attempting to configure develop branch protection..."
          # --- payload with restrictions (for org repos) ---
          PAYLOAD_ORG=$(cat <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["test","code-style"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": {
              "users": [],
              "teams": [],
              "apps": []
            },
            "required_conversation_resolution": true
          }
          EOF
          )

          # --- payload without restrictions (for user repos) ---
          PAYLOAD_USER=$(cat <<EOF
          {
            "required_status_checks": {
              "strict": false,
              "contexts": ["test","code-style"]
            },
            "enforce_admins": false,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "required_approving_review_count": 0
            },
            "restrictions": null,
            "required_conversation_resolution": true
          }
          EOF
          )

          # Try org-style first, fallback to user-style on 422
          if gh api --method PUT /repos/${{ github.repository }}/branches/develop/protection \
               --input - <<<"$PAYLOAD_ORG" 2>/dev/null; then
            echo "✓ Develop branch protected with restrictions"
          else
            echo "Falling back to no restrictions..."
            if gh api --method PUT /repos/${{ github.repository }}/branches/develop/protection \
                 --input - <<<"$PAYLOAD_USER" 2>/dev/null; then
              echo "✓ Develop branch protected without restrictions"
            else
              echo "⚠️ Warning: Failed to set develop branch protection."
              echo "This feature requires either GitHub Pro or a public repository."
              # Don't exit with error
            fi
          fi

      # 7) Protect feature-* via GraphQL with error handling
      - name: Configure feature-* branch protection
        run: |
          echo "Attempting to configure feature-* branch protection..."
          repo_node_id=$(gh api /repos/${{ github.repository }} | jq -r .node_id)

          create_rule() {
            local restriction=$1
            local query
            if [ "$restriction" = "restrict" ]; then
              query='mutation($repositoryId: ID!, $pattern: String!) {
                createBranchProtectionRule(input: {
                  repositoryId: $repositoryId,
                  pattern: $pattern,
                  allowsForcePushes: true,
                  allowsDeletions: true,
                  restrictsPushes: true
                }) { clientMutationId }
              }'
            else
              query='mutation($repositoryId: ID!, $pattern: String!) {
                createBranchProtectionRule(input: {
                  repositoryId: $repositoryId,
                  pattern: $pattern,
                  allowsForcePushes: true,
                  allowsDeletions: true
                }) { clientMutationId }
              }'
            fi

            output=$(gh api graphql -f query="$query" -F repositoryId="$repo_node_id" -F pattern="feature-*" 2>&1)
            exit_code=$?
            if [ $exit_code -eq 0 ]; then
              echo "✓ feature-* protected with $restriction"
              return 0
            else
              if echo "$output" | grep -q "Name already protected"; then
                echo "Feature-* protection already exists. Skipping."
                return 0
              else
                echo "Couldn't create rule with $restriction: $output"
                return $exit_code
              fi
            fi
          }

          if ! create_rule "restrict"; then
            echo "Trying fallback without restrictsPushes..."
            if ! create_rule "no-restrict"; then
              echo "⚠️ Warning: Failed to set feature-* branch protection."
              echo "This feature requires either GitHub Pro or a public repository."
              # Don't exit with error
            fi
          fi

      # 8) Protect v* tags with error handling
      - name: Configure protected tags (v*)
        run: |
          echo "Attempting to configure v* tag protection..."
          REPO="${{ github.repository }}"
          TAG_PATTERN="refs/tags/v*"
          RULESET_NAME="Protect v* tags"

          # Simplify checking for existing ruleset
          echo "Checking for existing ruleset '$RULESET_NAME'..."
          EXISTING_RULESETS=$(gh api "/repos/$REPO/rulesets" --jq '.[]' 2>/dev/null || echo "")

          # Check if a ruleset with the same name already exists
          if echo "$EXISTING_RULESETS" | jq -e --arg name "$RULESET_NAME" 'select(.name == $name)' > /dev/null 2>&1; then
            echo "Ruleset '$RULESET_NAME' already exists"
            echo "Skipping creation"
          else
            echo "Creating ruleset '$RULESET_NAME'..."
            PAYLOAD=$(cat <<-EOF
          {
            "name": "$RULESET_NAME",
            "target": "tag",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["$TAG_PATTERN"],
                "exclude": []
              }
            },
            "rules": [
              {"type": "update"},
              {"type": "deletion"}
            ]
          }
          EOF
            )

            output=$(gh api --method POST "/repos/$REPO/rulesets" --input - <<<"$PAYLOAD" 2>&1)
            exit_code=$?

            if [ $exit_code -eq 0 ]; then
              echo "✓ Ruleset created successfully"
            else
              # Handle "name must be unique" error gracefully
              if echo "$output" | grep -q -i "name must be unique\|already exists"; then
                echo "Ruleset with name '$RULESET_NAME' already exists"
                echo "This is expected if the ruleset was created in a previous run"
              else
                echo "⚠️ Warning: Failed to create ruleset:"
                echo "$output"
                echo "This feature requires either GitHub Pro or a public repository."
              fi
            fi
          fi

      # 9) Configure repository settings with error handling
      - name: Configure repository settings
        run: |
          REPO="${{ github.repository }}"
          echo "Configuring repository settings..."

          # Update repository settings via API
          if gh api --method PATCH "/repos/$REPO" \
            --input - <<-EOF
          {
            "allow_merge_commit": true,
            "allow_auto_merge": true,
            "delete_branch_on_merge": true,
            "allow_update_branch": true
          }
          EOF
          then
            echo "✓ Repository settings updated successfully"
          else
            echo "⚠️ Warning: Failed to update repository settings."
            echo "Some settings may require higher permissions or GitHub Pro."
          fi
