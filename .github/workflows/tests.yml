name: Tests
on:
  pull_request:
    branches: [main, develop]
jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python via uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      #----------------------------------------------
      # install dependencies (--locked fails the run
      # when uv.lock is out of date)
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Check optional performance extra
        run: uv run --no-sync python -c "import boilerplate_python.main"
      #----------------------------------------------
      #              run build test
      #----------------------------------------------
      - name: Run build test
        run: uv build
      #----------------------------------------------
      #           run python test suite
      #----------------------------------------------
      - name: Run tests
        run: uv run --no-sync pytest
      #----------------------------------------------
      #            run sonarcloud scan
      #----------------------------------------------
      #- name: Run SonarCloud scan
      #  uses: SonarSource/sonarcloud-github-action@master
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  #----------------------------------------------
  # Single required status check in front of the
  # matrix, so the branch protection context stays
  # "test" no matter which interpreters are listed
  # above.
  #----------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - name: Check test matrix result
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "::error::The test matrix did not pass."
            exit 1
          fi
          echo "All matrix jobs passed."
