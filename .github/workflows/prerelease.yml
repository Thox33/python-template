name: Pre-Release
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python via uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      #----------------------------------------------
      # install dependencies (--locked fails the run
      # when uv.lock is out of date)
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #              build and pre-release
      #----------------------------------------------
      - name: Build and Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          BUILD_METADATA="$(git branch --show-current).$(date +%Y%m%d)"
          TAG=$(uv run --no-sync semantic-release version --print --no-changelog --build-metadata "$BUILD_METADATA")
          uv run --no-sync semantic-release version --no-changelog --build-metadata "$BUILD_METADATA"
          uv run --no-sync semantic-release publish --tag "v${TAG}"
