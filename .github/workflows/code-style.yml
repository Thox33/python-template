name: Code-Styles
on:
  pull_request:
    branches: [main, develop]
jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python via uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      #----------------------------------------------
      #            load pre-commit cache
      #----------------------------------------------
      - name: Load pre-commit cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-
      #----------------------------------------------
      # install dependencies (--locked fails the run
      # when uv.lock is out of date)
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #              run pre-commit
      #----------------------------------------------
      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --from-ref origin/$GITHUB_BASE_REF --to-ref HEAD
