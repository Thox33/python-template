name: Code-Styles
on:
  pull_request:
    branches: [main, develop]
jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11
      #----------------------------------------------
      #        install & configure poetry
      #----------------------------------------------
      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      #----------------------------------------------
      #       load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
      - name: Load pre-commit cache
        uses: actions/cache@v5
        if: startsWith(runner.os, 'Linux')
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction
      #----------------------------------------------
      #              run pre-commit
      #----------------------------------------------
      - name: Run pre-commit
        run: |
          source $VENV
          pre-commit run --from-ref origin/$GITHUB_BASE_REF --to-ref HEAD
