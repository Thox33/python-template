name: Release
on:
  push:
    branches: [ main ]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python via uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      #----------------------------------------------
      #            load pre-commit cache
      #----------------------------------------------
      - name: Load pre-commit cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-
      #----------------------------------------------
      # install dependencies (--locked fails the run
      # when uv.lock is out of date)
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked --all-extras
      #----------------------------------------------
      #  run pre-commit and tests
      #----------------------------------------------
      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --all-files
      - name: Run tests
        run: uv run --no-sync pytest
      #- name: Run SonarCloud scan
      #  uses: SonarSource/sonarcloud-github-action@master
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      #    SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  release:
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}
    steps:
      #----------------------------------------------
      #   check-out repo and set-up python via uv
      #----------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      #----------------------------------------------
      # install dependencies (--locked fails the run
      # when uv.lock is out of date)
      #----------------------------------------------
      - name: Install dependencies
        run: uv sync --locked
      #----------------------------------------------
      #              build and release
      #----------------------------------------------
      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          TAG=$(uv run --no-sync semantic-release version --print)
          uv run --no-sync semantic-release version
          uv run --no-sync semantic-release publish --tag "v${TAG}"
      #----------------------------------------------
      #        Create sync PR main→develop
      #----------------------------------------------
      - name: Create PR from main to develop directly
        run: |
          PR_EXISTS=$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            gh pr create --base develop --head main --title "chore(release): sync version bump from main" --body "This PR brings the version bump committed by the release workflow back into the develop branch." --label "automation,sync"
          else
            echo "PR already exists. Skipping PR creation."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
